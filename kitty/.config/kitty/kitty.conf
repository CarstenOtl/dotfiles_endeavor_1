# ~/.config/kitty/kitty.conf

#: Fonts {{{

font_family      Hack Nerd Font Mono
bold_font        Hack Nerd Font Mono Bold
italic_font      Hack Nerd Font Mono Italic
bold_italic_font Hack Nerd Font Mono Bold Italic

font_size 12.0

# Nerd Font glyph ranges rendered from the Mono variant so icons stay in one cell
symbol_map U+E000-U+E00A,U+EA60-U+EBEB,U+E0A0-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B1,U+E700-U+E7C5,U+EE00-U+EE0B,U+F000-U+F2FF,U+F300-U+F372,U+F400-U+F533,U+F0001-U+F1AF0 Hack Nerd Font Mono

disable_ligatures never

#: }}}

#: Cursor {{{

cursor_shape           beam
cursor_blink_interval  0.5

#: }}}

#: Shell {{{

shell /usr/bin/zsh
term    xterm-256color

#: }}}

#: Scrollback {{{

scrollback_lines 10000

#: }}}

#: Terminal bell {{{

enable_audio_bell no

#: }}}

#: Window layout {{{

window_padding_width 6
confirm_os_window_close 0

#: }}}

#: Tab bar {{{

tab_bar_edge   bottom
tab_bar_style  powerline
tab_powerline_style slanted

#: }}}

#: Color scheme: One Dark {{{

foreground            #abb2bf
background            #282c34
selection_foreground  #282c34
selection_background  #979eab

cursor                #528bff
cursor_text_color     #282c34

url_color             #61afef

# Window borders
active_border_color   #61afef
inactive_border_color #3e4451
bell_border_color     #e5c07b

# Tabs
active_tab_foreground   #282c34
active_tab_background   #61afef
inactive_tab_foreground #abb2bf
inactive_tab_background #21252b
tab_bar_background      #21252b

# black
color0  #282c34
color8  #5c6370

# red
color1  #e06c75
color9  #e06c75

# green
color2  #98c379
color10 #98c379

# yellow
color3  #e5c07b
color11 #d19a66

# blue
color4  #61afef
color12 #61afef

# magenta
color5  #c678dd
color13 #c678dd

# cyan
color6  #56b6c2
color14 #56b6c2

# white
color7  #abb2bf
color15 #ffffff

#: }}}
